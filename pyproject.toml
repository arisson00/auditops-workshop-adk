[project]
name = "audit-ops"
version = "0.1.0"
description = "AuditOps: Solução Multi-Agente com Google ADK e Roteamento de Modelos por Complexidade"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-adk>=0.1.0",
    "google-genai>=0.1.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
